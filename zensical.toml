[project]
site_url = "https://yash-wadatkar-binaryveda.github.io/sdk-docs-site/"
site_name = "SDK & Backend Calls"
site_description = "Spintly SDK members and backend endpoints used by the IoT9 consumer app and the Connected Lock staff app, on iOS and Android"

copyright = "Godrej Locks &mdash; internal integration reference"

nav = [
  { "Home" = "index.md" },
  { "IoT9 Consumer App" = [
    { "Overview" = "iot9/index.md" },
    { "Reading these pages" = "iot9/conventions.md" },
    { "Kafka events" = "iot9/kafka-events.md" },
    { "1. User Onboarding" = "iot9/user-onboarding.md" },
    { "2. Lock Onboarding" = "iot9/lock-onboarding.md" },
    { "3. Home" = "iot9/home.md" },
    { "4. Lock Control Panel" = "iot9/lock-control-panel.md" },
    { "5. User Management" = "iot9/user-management.md" },
    { "6. Activity Trail" = "iot9/activity-trail.md" },
    { "7. Lock Settings" = "iot9/lock-settings.md" },
    { "8. Notifications" = "iot9/notifications.md" },
    { "9. Profile and Account" = "iot9/profile-and-account.md" },
  ] },
  { "Connected Lock Staff App" = [
    { "Overview" = "staff/index.md" },
    { "Reading these pages" = "staff/conventions.md" },
    { "1. User Onboarding" = "staff/user-onboarding.md" },
    { "2. Tasks" = "staff/tasks.md" },
    { "3. Rooms" = "staff/rooms.md" },
    { "4. Search" = "staff/search.md" },
    { "5. Control Panel" = "staff/control-panel.md" },
    { "6. Notifications" = "staff/notifications.md" },
    { "7. Profile and Logout" = "staff/profile-and-logout.md" },
  ] },
]

extra_css = ["stylesheets/extra.css?v=5"]
extra_javascript = ["javascripts/diagrams.js?v=5"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  # navigation.indexes is off on purpose: it folds a section's index.md into the
  # section header, which loses the "Overview" row from each project's sidebar.
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
