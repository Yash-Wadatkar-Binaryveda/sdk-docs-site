name: Documentation

# This site is an internal reference and is deliberately NOT published.
# GitHub Pages serves publicly even from a private repository, so instead of
# deploying, this workflow builds the site and attaches it as an artifact you
# can download from the run's summary page.
#
# --strict fails the build on warnings, which includes broken internal links
# and missing heading anchors — so a bad cross-reference cannot reach main.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install zensical

      - name: Build the site (fails on broken links)
        run: zensical build --clean --strict

      - name: Attach the built site
        uses: actions/upload-artifact@v4
        with:
          name: sdk-docs-site
          path: site
          retention-days: 30
